          - paragraph [ref=f56e280]: Spacious luggage compartment - Wide possibilities for organizing space for transportation and storage. Two-level organization of the luggage compartment.
      - generic [ref=f56e283]:
        - generic [ref=f56e286]:
          - heading "Dynamics and safety" [level=2] [ref=f56e287]
          - paragraph [ref=f56e288]: A durable and safe body, a powerful high-torque engine and an excellent transmission, all-wheel drive and good cross-country ability - the JAECOO J7 is ready to become a reliable and convenient partner on daily trips or exciting long-distance journeys.
        - generic [ref=f56e290]:
          - img "Modern engine and reliable transmission" [ref=f56e292]
          - heading "Modern engine" [level=3] [ref=f56e293]
          - paragraph [ref=f56e295]: JAECOO J7 is equipped with a modern turbocharged engine. With a working volume of 1.6 liters, its characteristics are close to those of two-liter engines. Power is 186 hp. With. (145 kW), and the torque reaches an impressive 290 Nm. The engine is paired with a 7DCT robotic transmission with two clutches. This 98% efficient transmission delivers shifts in just 0.2 seconds and ranks among the top 10 best transmissions in the world.
        - generic [ref=f56e297]:
