          - paragraph [ref=f56e250]: Comfortable chairs - The seats, with well-developed lateral support, are made of faux leather with accent stitching. The seats provide a comfortable fit and are heated and ventilated. The driver can save the usual seat position settings in the memory of his JAECOO J7.
        - button [ref=f56e254] [cursor=pointer]:
