          - heading "Technological design" [level=2] [ref=f56e146]
          - paragraph [ref=f56e147]: Our design philosophy melds technology with aesthetics, transforming vehicles into art. We focus on functional elegance and innovative user experiences. Every curve and feature is engineered for sophistication and ease, promising an unmatched driving experience. Discover the intersection of elegance and innovation in automotive design.
        - generic [ref=f56e149]:
          - generic [ref=f56e150]:
            - img "Rear View Mirrors" [ref=f56e152]
            - generic [ref=f56e153]:
              - heading "Rear view mirrors" [level=2] [ref=f56e155]
              - paragraph [ref=f56e157]: The mirrors on the pillars are a discreet but aesthetic design detail of the J7. Their contrasting inserts harmoniously resonate with other accent touches of the exterior.
          - generic [ref=f56e158]:
            - img "Retractable handles" [ref=f56e160]
            - generic [ref=f56e161]:
              - heading "Retractable handles" [level=2] [ref=f56e163]
              - paragraph [ref=f56e165]: The designers used a spectacular solution - door handles that automatically extend using an electric drive. Minimal force is required to open the door. The handles are not afraid of icing, even at the lowest temperatures.
          - generic [ref=f56e166]:
            - img "Wheels 19”" [ref=f56e168]
            - generic [ref=f56e169]:
              - heading "Wheels 19”" [level=2] [ref=f56e171]
              - paragraph [ref=f56e173]: Large 19-inch cast aluminum alloy wheels look stylish and impressive. The design of their pattern is made taking into account aerodynamic qualities and contributes to more efficient cooling of the brakes.
          - generic [ref=f56e174]:
            - img "Remote trunk release" [ref=f56e176]
            - generic [ref=f56e177]:
              - heading "Remote trunk release" [level=2] [ref=f56e179]
              - paragraph [ref=f56e181]: The hands-free trunk opening function is convenient and necessary if your hands are busy and the key is in your pocket. The rear door opening angle can be adjusted individually and the setting saved in the vehicle's memory.
      - img "JAECOO J7" [ref=f56e183]
