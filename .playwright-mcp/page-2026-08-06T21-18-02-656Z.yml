          - region "Какие шины Kumho подходят для внедорожника или пикапа?" [ref=f13e210]:
            - generic [ref=f13e211]: Для внедорожников, пикапов и кроссоверов предназначены линейка Road Venture (модели AT52, AT61, MT71) и шины CRUGEN — они рассчитаны на уверенное движение и на шоссе, и за его пределами.
