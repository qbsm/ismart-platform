    - generic [ref=f23e148]:
      - generic [ref=f23e149]:
        - heading "Зимние шины Kumho в каталоге" [level=2] [ref=f23e152]
        - generic [ref=f23e154]:
          - paragraph [ref=f23e155]:
            - text: В зимней линейке
            - generic [ref=f23e156]: 9 моделей и 432 типоразмера
            - text: ", посадочные диаметры"
            - generic [ref=f23e157]: от R13 до R22
            - text: ". Зимняя резина Kumho делится на шипованную и нешипованную (фрикционную): первая держит лёд и укатанный снег, вторая тише и лучше подходит городу с реагентами и частыми переходами через ноль."
          - paragraph [ref=f23e158]:
            - generic [ref=f23e159]: Нешипованные для легковых автомобилей
            - text: —
            - link "WinterCraft WP52+" [ref=f23e160] [cursor=pointer]:
              - /url: /tires/wp52-plus
            - text: с самым широким выбором размеров в каталоге (136 типоразмеров, R13–R21),
            - link "WinterCraft ice WI51" [ref=f23e161] [cursor=pointer]:
              - /url: /tires/wi51
            - text: (59 типоразмеров, R14–R20) и
            - link "WinterCraft WP72" [ref=f23e162] [cursor=pointer]:
              - /url: /tires/wp72
            - text: (33 типоразмера, R18–R21) для крупных дисков.
          - paragraph [ref=f23e163]:
            - generic [ref=f23e164]: Для кроссоверов и внедорожников
            - text: —
            - link "WinterCraft WS71" [ref=f23e165] [cursor=pointer]:
              - /url: /tires/ws71
            - text: (50 типоразмеров, R15–R22) и
            - link "WinterCraft ice WS51" [ref=f23e166] [cursor=pointer]:
              - /url: /tires/ws51
            - text: (21 типоразмер, R15–R19).
          - paragraph [ref=f23e167]:
            - generic [ref=f23e168]: Шипованные
            - text: —
            - link "WinterCraft ice WI32" [ref=f23e169] [cursor=pointer]:
              - /url: /tires/wi32
            - text: (77 типоразмеров, R13–R20) и
            - link "WinterCraft ice WS31" [ref=f23e170] [cursor=pointer]:
