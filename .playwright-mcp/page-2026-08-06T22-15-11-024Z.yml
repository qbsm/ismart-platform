            - text: .
          - paragraph [ref=f23e172]:
            - generic [ref=f23e173]: Для коммерческого транспорта
            - text: "— семейство WinterPorTran: шипованная"
            - link "CW11" [ref=f23e174] [cursor=pointer]:
              - /url: /tires/cw11
            - text: и нешипованная
            - link "CW51" [ref=f23e175] [cursor=pointer]:
              - /url: /tires/cw51
            - text: ", по R14–R17, с усиленными C-типоразмерами для фургонов и микроавтобусов."
      - generic [ref=f23e176]:
        - heading "Когда менять и что учесть" [level=2] [ref=f23e179]
        - generic [ref=f23e181]:
          - paragraph [ref=f23e182]:
            - text: Ориентир для смены комплекта — устойчивые среднесуточные
            - generic [ref=f23e183]: +7 °C
            - text: ", а не календарная дата: летний состав на холоде дубеет, зимний в тепле быстрее изнашивается."
          - paragraph [ref=f23e184]:
            - text: Шипы дают выигрыш на льду и укатанном снегу, но шумнее и требуют аккуратной обкатки. Фрикционные модели предпочтительнее там, где дороги чистят и реагенты держат асфальт мокрым. Всесезонные шины в устойчивый мороз и на льду уступают зимним — сравнить составы линеек можно на странице
            - link "всесезонных шин" [ref=f23e185] [cursor=pointer]:
              - /url: /tires/allseason
            - text: .
          - paragraph [ref=f23e186]:
            - text: Размер берут заводской — он указан в руководстве по эксплуатации и на табличке в проёме водительской двери. Подобрать модель по типу автомобиля и приоритету помогает
            - link "конфигуратор" [ref=f23e187] [cursor=pointer]:
              - /url: /podbor
            - text: .
