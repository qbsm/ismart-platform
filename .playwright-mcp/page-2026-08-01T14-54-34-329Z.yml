                  - paragraph [ref=f66e35]:
                    - text: Записывалась к Николаю на плановое обслуживание перед дальней поездкой. Хотела просто проверить машину для спокойствия. В итоге всё посмотрели внимательно, нашли пару моментов, которые лучше было сделать сейчас, и объяснили почему. Сделали аккуратно, по времени уложились, по стоимости всё как согласовали. После выдачи машины Николай коротко прошёлся по выполненным работам и ответил на пару моих вопросов. Спокойный, понятный рабочий подход, с качественным результатом.
