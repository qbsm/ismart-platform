                    - listitem [ref=f66e49]
                  - paragraph [ref=f66e50]:
                    - text: "В этот раз приезжал с конкретным вопросом по подвеске — появился посторонний звук, который уже начал напрягать. Николай предложил не гадать, а спокойно всё проверить по шагам. В итоге нашли причину быстрее, чем я ожидал, и без лишних «заодно давайте поменяем ещё вот это». Понравилось, что всё прошло без суеты: согласовали работы, обозначили стоимость, уложились в сроки. По факту объяснил, что сделали и почему именно так. Нормальный рабочий процесс без лишней драматизации — за это и ценю."
