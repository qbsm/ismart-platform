    - generic [ref=f28e381]:
      - generic [ref=f28e382]:
        - heading "Конфигуратор подбора шин" [level=2] [ref=f28e385]
        - generic [ref=f28e386]: Четыре вопроса — тип автомобиля, сезон, приоритет и размер — и в подборке останутся только подходящие модели Kumho из этого каталога.
      - link "Подобрать шины" [ref=f28e388] [cursor=pointer]:
        - /url: https://kumho-tires.ru/podbor
    - generic [ref=f28e391]:
      - generic [ref=f28e392]:
        - heading "Как выбрать шины Kumho по сезону" [level=2] [ref=f28e395]
        - generic [ref=f28e397]:
          - paragraph [ref=f28e398]:
            - text: В каталоге
            - generic [ref=f28e399]: 36 моделей и 1148 типоразмеров
            - text: с посадочным диаметром
            - generic [ref=f28e400]: от R12 до R22
            - text: . Отобрать нужные помогает фильтр по сезону, диаметру, ширине и высоте профиля.
          - paragraph [ref=f28e401]:
            - generic [ref=f28e402]: Зимние шины
            - text: —
            - generic [ref=f28e403]: 9 моделей, 432 типоразмера
            - text: "(R13–R22). Шипованные рассчитаны на лёд и укатанный снег:"
            - link "WinterCraft ice WI32" [ref=f28e404] [cursor=pointer]:
              - /url: /tires/wi32
            - text: (77 типоразмеров),
            - link "WS31" [ref=f28e405] [cursor=pointer]:
              - /url: /tires/ws31
            - text: и
            - link "WinterPorTran CW11" [ref=f28e406] [cursor=pointer]:
              - /url: /tires/cw11
            - text: "для микроавтобусов и фургонов. Нешипованные (фрикционные) — для города и трассы с частыми переходами через ноль:"
            - link "WinterCraft WP52+" [ref=f28e407] [cursor=pointer]:
              - /url: /tires/wp52-plus
            - text: (136 типоразмеров, самый широкий выбор),
            - link "WS71" [ref=f28e408] [cursor=pointer]:
              - /url: /tires/ws71
            - text: для мощных кроссоверов,
            - link "WP72" [ref=f28e409] [cursor=pointer]:
              - /url: /tires/wp72
            - text: ","
            - link "WinterCraft ice WI51" [ref=f28e410] [cursor=pointer]:
              - /url: /tires/wi51
            - text: ","
            - link "WS51" [ref=f28e411] [cursor=pointer]:
              - /url: /tires/ws51
            - text: и коммерческая
            - link "CW51" [ref=f28e412] [cursor=pointer]:
              - /url: /tires/cw51
            - text: .
          - paragraph [ref=f28e413]:
            - generic [ref=f28e414]: Всесезонные шины
            - text: —
            - generic [ref=f28e415]: 11 моделей, 253 типоразмера
            - text: "(R13–R20). Подходят там, где зима мягкая, а пробег небольшой: не нужен второй комплект и двойной шиномонтаж. Для легковых автомобилей —"
            - link "SOLUS HA32" [ref=f28e416] [cursor=pointer]:
              - /url: /tires/ha32
            - text: (97 типоразмеров),
            - link "HA32+" [ref=f28e417] [cursor=pointer]:
              - /url: /tires/ha32-plus
            - text: и
            - link "HA31" [ref=f28e418] [cursor=pointer]:
              - /url: /tires/ha31
            - text: ; для внедорожников и пикапов — линейка Road Venture (
            - link "AT52" [ref=f28e419] [cursor=pointer]:
              - /url: /tires/at52
            - text: ","
            - link "KL71" [ref=f28e420] [cursor=pointer]:
              - /url: /tires/kl71
            - text: ","
            - link "MT71" [ref=f28e421] [cursor=pointer]:
              - /url: /tires/mt71
            - text: ); для фургонов —
            - link "PorTran CX11" [ref=f28e422] [cursor=pointer]:
              - /url: /tires/cx11
            - text: .
          - paragraph [ref=f28e423]:
            - generic [ref=f28e424]: Летние шины
            - text: —
            - generic [ref=f28e425]: 16 моделей, 463 типоразмера
            - text: "(R12–R22): линейки ECSTA, Ecowing, CRUGEN и PorTran. В устойчивые морозы и на льду зимняя резина безопаснее любой всесезонной — всесезонные модели рассчитаны на мягкую зиму."
          - paragraph [ref=f28e426]:
            - generic [ref=f28e427]: Коммерческий транспорт
            - text: — семейство PorTran,
            - generic [ref=f28e428]: 107 усиленных C-типоразмеров
            - text: "(R12–R18): летняя"
            - link "PorTran KC53" [ref=f28e429] [cursor=pointer]:
              - /url: /tires/kc53
            - text: ", всесезонная"
            - link "PorTran CX11" [ref=f28e430] [cursor=pointer]:
              - /url: /tires/cx11
            - text: ", зимние"
            - link "WinterPorTran CW11" [ref=f28e431] [cursor=pointer]:
              - /url: /tires/cw11
            - text: (шипованная) и
            - link "WinterPorTran CW51" [ref=f28e432] [cursor=pointer]:
              - /url: /tires/cw51
            - text: (нешипованная) — для фургонов, микроавтобусов и лёгких грузовиков.
      - generic [ref=f28e433]:
        - heading "Оригинальная продукция и гарантия" [level=2] [ref=f28e436]
        - generic [ref=f28e438]:
          - paragraph [ref=f28e439]:
            - text: «Север Авто» —
            - generic [ref=f28e440]: официальный дистрибьютор
            - text: шин Kumho | Кумхо компании Kumho Tire в России. Шины поставляются напрямую и продаются через авторизованные шинные центры, поэтому на них действует
            - generic [ref=f28e441]: гарантия производителя
            - text: .
          - paragraph [ref=f28e442]:
            - text: Дополнительно работает программа
            - link "«Расширенная гарантия Kumho»" [ref=f28e443] [cursor=pointer]:
              - /url: /warranty
            - text: —
            - generic [ref=f28e444]: ещё один год защиты
            - text: от эксплуатационных повреждений сверх заводской гарантии. Оформить её можно
            - generic [ref=f28e445]: только на шины, купленные у авторизованных партнёров
            - text: ": их список и карта — в разделе"
            - link "«Где купить»" [ref=f28e446] [cursor=pointer]:
              - /url: /buy
            - text: ", там же отмечены центры, принимающие обращения по гарантии."
          - paragraph [ref=f28e447]:
            - text: На боковине любой шины Kumho есть
            - generic [ref=f28e448]: заводская маркировка с датой производства
            - text: — по ней видно, что шина не залежалась на складе.
