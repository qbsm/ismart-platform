            - generic [ref=e428]:
              - paragraph [ref=e429]: TANK 300 — выбор для тех, кто ищет рамный внедорожник с ярким характером, удобный для города и уверенный за его пределами. Модель сочетает компактный для класса формат, высокий дорожный просвет, полный привод и прочную конструкцию, поэтому одинаково органично чувствует себя в плотном городском потоке, на зимней дороге и на маршрутах, где важна настоящая проходимость.
              - paragraph [ref=e430]: "На странице представлены автомобили, которые доступны у официального дилера TANK БорисХоф в Москве. Здесь удобно сравнить комплектации, цвет, оснащение и статус конкретного автомобиля, а также быстро перейти к характеристикам, галерее и вариантам покупки. Если важны скорость сделки и прозрачные условия, это сильная точка модели: мы работаем с автомобилями из актуального стока, предлагаем тест-драйв, кредит, Trade-in и полное сопровождение покупки."
              - paragraph [ref=e431]: С практической точки зрения TANK 300 особенно ценят за баланс манёвренности и внедорожного потенциала. Рамная архитектура, интеллектуальный полный привод, высокий клиренс и полезный набор водительских ассистентов делают его универсальным решением на каждый день. После покупки вы получаете официальный сервис, доступ к оригинальным запчастям, поддержку по регламентному обслуживанию и гарантию производителя. Если нужен новый TANK 300 в наличии в Москве без компромиссов по характеру, оснащению и уверенности на любой дороге, TANK БорисХоф помогает быстро перейти от выбора к реальной покупке.
