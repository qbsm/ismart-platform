        - paragraph [ref=f24e66]:
          - text: "Подбор опирается на четыре параметра:"
          - generic [ref=f24e67]: тип автомобиля
          - text: ","
          - generic [ref=f24e68]: сезон
          - text: ","
          - generic [ref=f24e69]: приоритет в поведении шины
          - text: и
          - generic [ref=f24e70]: типоразмер
          - text: . Первые два отсекают неподходящие модели, приоритет поднимает выше те, что настроены под вашу задачу, размер сужает выдачу до конкретных позиций. Размер можно пропустить — тогда конфигуратор покажет все подходящие модели.
      - generic [ref=f24e71]:
        - heading "Где посмотреть размер шины" [level=2] [ref=f24e74]
        - paragraph [ref=f24e77]:
          - text: "Размер написан на боковине и выглядит так:"
          - generic [ref=f24e78]: 205/55 R16 91V
          - text: . Первое число —
          - generic [ref=f24e79]: ширина протектора
          - text: в миллиметрах, второе —
          - generic [ref=f24e80]: высота профиля
          - text: в процентах от ширины, число после R —
          - generic [ref=f24e81]: посадочный диаметр
          - text: в дюймах, он должен совпадать с диаметром диска. Дальше идут
          - generic [ref=f24e82]: индекс нагрузки
          - text: (91 — 615 кг на колесо) и
          - generic [ref=f24e83]: индекс скорости
          - text: "(V — до 240 км/ч): брать ниже заводских значений нельзя. Заводские размеры для вашей машины указаны в руководстве по эксплуатации и на табличке в проёме водительской двери или на лючке бензобака."
      - generic [ref=f24e84]:
        - heading "Какой сезон выбрать" [level=2] [ref=f24e87]
        - generic [ref=f24e89]:
          - paragraph [ref=f24e90]:
            - generic [ref=f24e91]: Летние
            - text: "шины рассчитаны на температуру примерно от +7 °C: их состав твердеет на холоде и теряет сцепление."
            - generic [ref=f24e92]: Зимние шипованные
            - text: держат лёд и укатанный снег — им место там, где зима настоящая и дороги чистят не всегда.
            - generic [ref=f24e93]: Зимние нешипованные
            - text: (липучка) тише и лучше для города с реагентами и частыми переходами через ноль.
            - generic [ref=f24e94]: Всесезонные
            - text: — компромисс для мягкой зимы и межсезонья; в сильный мороз и на льду они уступают зимним.
          - paragraph [ref=f24e95]: "Менять комплект стоит по устойчивой погоде, а не по календарю: ориентир — среднесуточные +7 °C."
      - generic [ref=f24e96]:
        - heading "Легковые, внедорожные и коммерческие" [level=2] [ref=f24e99]
        - paragraph [ref=f24e102]:
          - text: Для
          - generic [ref=f24e103]: кроссоверов и внедорожников
          - text: нужен каркас, рассчитанный на большую массу и центр тяжести выше — это линейки
          - link "Road Venture" [ref=f24e104] [cursor=pointer]:
            - /url: /tires/at52
          - text: и CRUGEN. Для
          - generic [ref=f24e105]: фургонов и микроавтобусов
          - text: выпускаются усиленные типоразмеры с индексом
          - generic [ref=f24e106]: C
          - text: "и повышенным индексом нагрузки — семейство PorTran. Ставить на коммерческий транспорт легковую шину нельзя: она не рассчитана на постоянную загрузку."
      - generic [ref=f24e107]:
        - heading "Что даёт приоритет" [level=2] [ref=f24e110]
        - paragraph [ref=f24e113]:
          - generic [ref=f24e114]: Комфорт и тишина
          - text: — плавность хода и низкий уровень шума, для города и трассы.
          - generic [ref=f24e115]: Управляемость
          - text: — точность реакций на руль и сцепление в поворотах, для динамичной езды.
          - generic [ref=f24e116]: Экономичность
          - text: — низкое сопротивление качению и меньший расход топлива.
          - generic [ref=f24e117]: Проходимость и нагрузка
          - text: — грунт, лёгкое бездорожье и работа под весом. Приоритет не отсекает модели, а поднимает подходящие выше в подборке, поэтому можно отметить несколько.
