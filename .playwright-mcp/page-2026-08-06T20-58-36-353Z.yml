            - generic [ref=f30e206]: «Север Авто» — официальный дистрибьютор шин Kumho в России. Купить шины Kumho можно в 155 авторизованных точках продаж в 55 городах и 35 регионах — от Санкт-Петербурга и Москвы до Новосибирска, Уфы, Перми, Екатеринбурга и Воронежа. Все они участвуют в программе «Расширенная гарантия Kumho». Адреса, телефоны и карта — в разделе «Где купить».
