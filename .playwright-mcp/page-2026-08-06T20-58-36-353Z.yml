          - region "Какие зимние шины Kumho есть в каталоге?" [ref=f30e225]:
            - generic [ref=f30e226]: "Зимняя линейка Kumho — 9 моделей и 432 типоразмера. Шипованные: WinterCraft ice WI32 (R13–R20, 77 типоразмеров), WS31 (R16–R20) и WinterPorTran CW11 для микроавтобусов и фургонов. Нешипованные: WinterCraft WP52+ (R13–R21, 136 типоразмеров — самый широкий выбор), WS71 (R15–R22, индексы скорости до W), WP72 (R18–R21), WinterCraft ice WI51 и WS51, а также коммерческая WinterPorTran CW51."
