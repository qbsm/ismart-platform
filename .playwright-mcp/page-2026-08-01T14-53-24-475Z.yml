                    - listitem [ref=f60e93]
                  - paragraph [ref=f60e94]:
                    - text: Добрый день,хочу поблагодарить менеджера Юрия за его опыт,потдержку ,и за помощь в приобретение автомобиля Voyah . Приехал с другом просто посмотреть машину,нас встретил Юрий,угостил вкусным кофе,все показал,все рассказал ,тут же договорился на тестдрайв.Автомобиль мне зашел сразу,в наличие автомобилей небыло,но благодаря Юрию его привезли на следующий день. Всей суммы небыло для покупки авто,юрий предложил много вариантов как сделать ,чтоб авто всетаки я приобрел. Помог с кредитом,все разжувал до мелочей,принял машину в трыйдын. Даже после сделки,не отпустил меня пока я полностью не разобрался с авто,так как впервые имею такой космический корабль. Огромное человеческое спасибо за такой теплый прием Юрию Хатько. От себя просьба к его руководству,выписать огроменную премию такому замечательному сотруднику.
