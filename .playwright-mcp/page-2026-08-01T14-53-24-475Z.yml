                    - listitem [ref=f60e78]
                  - paragraph [ref=f60e79]:
                    - text: Приветствую всех читающих мой отзыв! Перед новым годом озадачился вопросом смены авто в силу изменений с утильсбором. Решил попробовать тест драйв Voyah Free, попытался записаться в несколько салонов диллеров, без результата. Оставил заявку в БорисХоф, через несколько минут перезвонила девушка и сообщила, что передала мою заявку менеджеру, так началось наше знакомство с Юрием Хатько и Voyah Free. В последствии его работы, профессионализма и клиентоориентированности был приобретен Voyah Free. Машину готовили неделю к выдаче. При получении никаких нюансов! Юрий спасибо за вашу работу и то что поддерживаете связь с клиентами даже после сделки! Я специально выждал время с момента покупки, чтобы сформировать мнение для отзыва. Сегодня посещал БорисХоф снова для прохождения ТО-0, тысяча километров позади. При визите меня встретил, Юрий и отвел к Антону Шеремету. Антон максимально профессионально все объяснил, дал советы по маслу и оперативно принял машину в работу! Ранее озвучивали сроки работ приблизительно в 3-4 часа, но все работы выполнили за 2, отличный подход! Антон вам так же выражаю благодарность за профессионализм и сервис! По окончании получил смс с ссылкой на видео о проведенных работах и диагностике. Очень впечатлило) Ребята спасибо вам за работу, обязательно приеду к вам снова!
                    - paragraph [ref=f60e80]:
                      - text: ...
                      - link "ещё" [ref=f60e81] [cursor=pointer]:
                        - /url: https://yandex.ru/maps/org/boriskhof_voyah_vostok/174809539865/reviews?utm_source=maps-reviews-widget&utm_medium=reviews&utm_content=read-more
