                  - paragraph [ref=f60e64]:
                    - text: Проделанной работой доволен. Все рассказали, сделали. От обещанного времени машину выдали не много раньше. До работ по первому ТО, обращался по вопросу сход-развала. Сход-развал сделали с первого раза. При этом ранее обращался к другому дилеру, сказали, что сделать не могут. Отдельная благодарность мастеру приемщику Крутецкой Елене. Готова ответить на вопросы и рассказать. По стоимости думаю как и у всех, так как акция от Моторинвеста.
