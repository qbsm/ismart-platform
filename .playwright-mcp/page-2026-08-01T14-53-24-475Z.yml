                    - text: Посетил Evolute & Voyah Балашиха, хоть и далеко от меня (на другой стороне Москвы), но поехал и не прогадал. Выбирал этого дилера по цене за проведение технического обслуживания, цена оказалась лучшая по Москве. Кстати, не только цена самих работ, но и оригинальных комплектующих. Что порадовало (я думаю про лояльность к посетителям, чистоту, порядок и отличное место для ожидания писать не буду здесь все на высоте, видно, что уважают клиента и себя) приняли вовремя, внимательно выслушали все замечания по машине, разрешили посещение ремонтной зоны, где мастер рассказал, что сделал по замечаниям. До этого был в Мейджер на Новой Риге с теми же замечаниями, но там ничего не нашли, а здесь определили незатянутые элементы подвески передней (это автомобилю 3 месяца, так собирают в Липечке) и проблема с рулевым управлением, то же не затянуто было (при повороте руля в лево в право обнаруживался люфт и стук). Есть одно предложение почему бы в зону ожидания не вывести видео с рем. зоны, я бы ч удовольствием наблюдал за процессом. Короче рекомендую владельцам Evolute этот сервис. Хочу выразить благодарность мастеру приемщику Елене Крутецкой и мастеру Дмитрию. Если все так и будет продолжаться я буду обращаться к Вам.
