        - list [ref=f59e332]:
          - listitem [ref=f59e333]: 1 или 3 года заводской гарантии на кроссоверы FREE и минивэны DREAM, приобретенные неофициально.
          - listitem [ref=f59e334]: Дополнительные преимущества с включенными в «пакет» услугами технической поддержки «VOYAH – ПОМОЩЬ НА ДОРОГЕ».
          - listitem [ref=f59e335]: Обновление прошивки, установка новейшей версии русификации, а также доступ в магазин приложений VOYAH STORE.
        - generic [ref=f59e336]:
          - text: Премиальный бренд VOYAH запускает новую сервисную программу «ГАРАНТИЯ + ПОДДЕРЖКА» для российских автовладельцев, приобретших автомобили до 1 сентября 2024 года неофициально. Программа предназначена для владельцев моделей DREAM и FREE и предлагает возможность оформить заводскую гарантию сроком на 1 или 3 года (до 100 000 км пробега). Условие — пробег автомобиля не должен превышать 80 000 км. Варианты программы включают гарантии на основные узлы (двигатель, батарея, тормозная система и др.) или полное гарантийное покрытие.Стоимость программы начинается от
          - generic [ref=f59e337]: 135 000 ₽
          - text: "и включает обновление ПО, установку русификации и доступ к VOYAH STORE для установки локальных сервисов. В пакет входит экстренная техническая помощь: ремонт шин, запуск двигателя, эвакуация и транспортировка автомобиля при разрядке батареи или авариях. Услуги доступны на территории России, Беларуси и Казахстана."
