          - generic [ref=f8e78]: 205/55 R16 91V
          - text: . Первое число —
          - generic [ref=f8e79]: ширина протектора
          - text: в миллиметрах, второе —
          - generic [ref=f8e80]: высота профиля
          - text: в процентах от ширины, число после R —
          - generic [ref=f8e81]: посадочный диаметр
          - text: в дюймах, он должен совпадать с диаметром диска. Дальше идут
