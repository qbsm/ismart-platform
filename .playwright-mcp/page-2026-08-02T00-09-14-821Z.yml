                  - text: 12.04 записался для прохождения ТО1 Солерс SF1. Сходу мастер озвучил стоимость 20700р. На мой вопрос - почему на информационном стенде указа цена 14700, начал мямлить что-то про изменившиеся расценки. Когда задал вопрос о том, что входит в ТО, мастер начал путаться в показаниях. Потом кому-то позвонил и сообщил, что , якобы , мне посчитали дорогое масло в канистры, а если залить бочковое, то ТО будет как раз- 14700р. Потом мастер встал, обрадовал меня, что по времени ТО займет 3-4часа и куда-то вышел. А вернувшись сообщил, что стоимость будет всё таки 17700!) Тут я окончательно понял, что нахожусь на базаре, а не у официального дилера. Дальше торговаться не стал, и забрав документы, удалился. Было, конечно, весело, но жаль потраченного времени.
