    - generic [ref=f2e381]:
      - generic [ref=f2e382]:
        - heading "Как выбрать шины Kumho по сезону" [level=2] [ref=f2e385]
        - generic [ref=f2e387]:
          - paragraph [ref=f2e388]:
            - text: В каталоге
            - generic [ref=f2e389]: 36 моделей и 1148 типоразмеров
            - text: с посадочным диаметром
            - generic [ref=f2e390]: от R12 до R22
            - text: . Отобрать нужные помогает фильтр по сезону, диаметру, ширине и высоте профиля.
          - paragraph [ref=f2e391]:
            - generic [ref=f2e392]: Зимние шины
            - text: —
            - generic [ref=f2e393]: 9 моделей, 432 типоразмера
            - text: "(R13–R22). Шипованные рассчитаны на лёд и укатанный снег:"
            - link "WinterCraft ice WI32" [ref=f2e394] [cursor=pointer]:
              - /url: /tires/wi32
            - text: (77 типоразмеров),
            - link "WS31" [ref=f2e395] [cursor=pointer]:
              - /url: /tires/ws31
            - text: и
            - link "WinterPorTran CW11" [ref=f2e396] [cursor=pointer]:
              - /url: /tires/cw11
            - text: "для микроавтобусов и фургонов. Нешипованные (фрикционные) — для города и трассы с частыми переходами через ноль:"
            - link "WinterCraft WP52+" [ref=f2e397] [cursor=pointer]:
              - /url: /tires/wp52-plus
            - text: (136 типоразмеров, самый широкий выбор),
            - link "WS71" [ref=f2e398] [cursor=pointer]:
              - /url: /tires/ws71
            - text: для мощных кроссоверов,
            - link "WP72" [ref=f2e399] [cursor=pointer]:
              - /url: /tires/wp72
            - text: ","
            - link "WinterCraft ice WI51" [ref=f2e400] [cursor=pointer]:
              - /url: /tires/wi51
            - text: ","
            - link "WS51" [ref=f2e401] [cursor=pointer]:
              - /url: /tires/ws51
            - text: и коммерческая
            - link "CW51" [ref=f2e402] [cursor=pointer]:
              - /url: /tires/cw51
            - text: .
          - paragraph [ref=f2e403]:
            - generic [ref=f2e404]: Всесезонные шины
            - text: —
            - generic [ref=f2e405]: 11 моделей, 253 типоразмера
            - text: "(R13–R20). Подходят там, где зима мягкая, а пробег небольшой: не нужен второй комплект и двойной шиномонтаж. Для легковых автомобилей —"
            - link "SOLUS HA32" [ref=f2e406] [cursor=pointer]:
              - /url: /tires/ha32
            - text: (97 типоразмеров),
            - link "HA32+" [ref=f2e407] [cursor=pointer]:
              - /url: /tires/ha32-plus
            - text: и
            - link "HA31" [ref=f2e408] [cursor=pointer]:
              - /url: /tires/ha31
            - text: ; для внедорожников и пикапов — линейка Road Venture (
            - link "AT52" [ref=f2e409] [cursor=pointer]:
              - /url: /tires/at52
            - text: ","
            - link "KL71" [ref=f2e410] [cursor=pointer]:
              - /url: /tires/kl71
            - text: ","
            - link "MT71" [ref=f2e411] [cursor=pointer]:
              - /url: /tires/mt71
            - text: ); для фургонов —
            - link "PorTran CX11" [ref=f2e412] [cursor=pointer]:
              - /url: /tires/cx11
            - text: .
          - paragraph [ref=f2e413]:
            - generic [ref=f2e414]: Летние шины
            - text: —
            - generic [ref=f2e415]: 16 моделей, 463 типоразмера
            - text: "(R12–R22): линейки ECSTA, Ecowing, CRUGEN и PorTran. В устойчивые морозы и на льду зимняя резина безопаснее любой всесезонной — всесезонные модели рассчитаны на мягкую зиму."
          - paragraph [ref=f2e416]:
            - generic [ref=f2e417]: Коммерческий транспорт
            - text: — семейство PorTran,
            - generic [ref=f2e418]: 107 усиленных C-типоразмеров
            - text: "(R12–R18): летняя"
            - link "PorTran KC53" [ref=f2e419] [cursor=pointer]:
              - /url: /tires/kc53
            - text: ", всесезонная"
            - link "PorTran CX11" [ref=f2e420] [cursor=pointer]:
              - /url: /tires/cx11
            - text: ", зимние"
            - link "WinterPorTran CW11" [ref=f2e421] [cursor=pointer]:
              - /url: /tires/cw11
            - text: (шипованная) и
            - link "WinterPorTran CW51" [ref=f2e422] [cursor=pointer]:
              - /url: /tires/cw51
            - text: (нешипованная) — для фургонов, микроавтобусов и лёгких грузовиков.
      - generic [ref=f2e423]:
        - heading "Оригинальная продукция и гарантия" [level=2] [ref=f2e426]
        - generic [ref=f2e428]:
          - paragraph [ref=f2e429]:
            - text: «Север Авто» —
            - generic [ref=f2e430]: официальный дистрибьютор
            - text: шин Kumho | Кумхо компании Kumho Tire в России. Шины поставляются напрямую и продаются через авторизованные шинные центры, поэтому на них действует
            - generic [ref=f2e431]: гарантия производителя
            - text: .
          - paragraph [ref=f2e432]:
            - text: Дополнительно работает программа
            - link "«Расширенная гарантия Kumho»" [ref=f2e433] [cursor=pointer]:
              - /url: /warranty
            - text: —
            - generic [ref=f2e434]: ещё один год защиты
            - text: от эксплуатационных повреждений сверх заводской гарантии. Оформить её можно
            - generic [ref=f2e435]: только на шины, купленные у авторизованных партнёров
            - text: ": их список и карта — в разделе"
            - link "«Где купить»" [ref=f2e436] [cursor=pointer]:
              - /url: /buy
            - text: ", там же отмечены центры, принимающие обращения по гарантии."
          - paragraph [ref=f2e437]:
            - text: На боковине любой шины Kumho есть
            - generic [ref=f2e438]: заводская маркировка с датой производства
            - text: — по ней видно, что шина не залежалась на складе.
