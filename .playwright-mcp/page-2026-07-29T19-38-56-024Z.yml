        - heading "Premium Comfort" [level=1] [ref=f50e180]
        - paragraph [ref=f50e181]: The front seats of the OMODA C5 are inspired by sports car design, with a high one-piece headrest, advanced lateral support for seat cushions, and perforated, high-quality eco-leather upholstery that delivers both comfort and style.
