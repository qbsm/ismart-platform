                  - listitem [ref=f8e70]: Сезонные свежие овощи
                  - listitem [ref=f8e71]: Мини-бриошь со взбитым сливочным маслом и чёрной икрой
              - button "Показать всё меню" [ref=f8e72] [cursor=pointer]
          - paragraph [ref=f8e74]: Без лишних формальностей, но с должным изяществом. Непринуждённый, но внимательный к каждой детали. По-итальянски гостеприимный и по-французски элегантный. Этот вечер обещает стать настоящим светским событием, где миланская спреццатура и парижский шик встречаются под сводами петербургского необарокко, даря гостям не просто впечатления, а возможность хотя бы на один вечер оказаться в той самой Прекрасной эпохе.
