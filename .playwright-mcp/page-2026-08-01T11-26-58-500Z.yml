            - paragraph [ref=f8e48]: Санкт-Петербург, ул. Восстания 45
            - paragraph [ref=f8e49]: "23 августа особняк Мясникова на один вечер вернётся в Прекрасную эпоху: ужин братьев Мясниковых при свечах — общий стол от бренд-шефов Joli и Salone, музыка, танцы и разговоры об искусстве за бокалом хорошего вина."
          - generic [ref=f8e50]:
            - heading "Там, где история оживает" [level=2] [ref=f8e51]
            - generic [ref=f8e52]:
              - paragraph [ref=f8e53]: Давайте представим, что на дворе не лето 2026 года, а конец XIX — начало ХХ века. Период расцвета культуры и технического прогресса. Эпоха бульваров, кафе и кабаре. Время изобретения радио и кино.
              - paragraph [ref=f8e54]: "В Париже строят Эйфелеву башню. В Венеции проходит первая Биеннале, а операми молодого и гениального композитора Джакомо Пуччини восхищается вся Италия. В Петербурге Врубель пишет «Демона сидящего», Чайковский создаёт Шестую симфонию, а классический русский балет достигает своего пика: на сцене Мариинского театра проходят премьеры «Спящей красавицы» и «Щелкунчика»."
              - paragraph [ref=f8e55]: В историю этот период вошёл под названием Belle Époque, и 23 августа мы приглашаем вас на один вечер перенестись в эту самую эпоху. Тем более, что принимать гостей будет её непосредственный свидетель — особняк Мясникова, в музыкальном салоне которого в те годы ставил пьесы Всеволод Мейерхольд, выступала Вера Комиссаржевская и пел Фёдор Шаляпин.
          - paragraph [ref=f8e57]: Музыка, танцы и разговоры об искусстве за бокалом хорошего вина. Центром притяжения станет общий стол, за которым будет подан ужин от шеф-поваров Joli и Salone.
          - generic [ref=f8e58]:
            - heading "Гастрономия вечера" [level=2] [ref=f8e59]
            - paragraph [ref=f8e60]: "Меню создано специально для этого вечера и существует только в рамках этого события. В его основе — традиции русской и европейской кухни конца XIX века, сезонные продукты и авторское прочтение классических рецептов. Каждая подача дополняет атмосферу вечера, не отвлекая внимание от главного: общения, музыки и истории особняка."
            - generic [ref=f8e61]:
