      - generic [ref=f127e127]: Ставка маркетинговой программы ООО «АИТ», по условиям которой покупателю предоставляется такая специальная цена на автомобиль, что расходы на его приобретение по данной программе сопоставимы с расходами по кредиту по ставке партнёра — ПАО «Сбербанк». Банк не определяет размер специальной цены на автомобиль, порядок предоставления и категории автомобилей, реализуемых по специальной цене.
      - generic [ref=f127e128]: Кредит предоставляется Публичным акционерным обществом «Сбербанк России» (ПАО Сбербанк) (лицензия Центрального банка Российской Федерации на осуществление банковских операций от 11.08.2015 № 1481, ОГРН 1027700132195).
      - generic [ref=f127e129]: "Кредитная субпрограмма «Директ Персональный» кредитной программы «Директ»: диапазон значений полной стоимости кредита составляет в % годовых от 0.010 до 14.710. Размер процентной ставки зависит от первоначального взноса и срока кредита. Первоначальный взнос от 10% до 90% от стоимости автомобиля и дополнительного оборудования, срок кредитования от 12 до 96 мес., сумма кредита от 100 000 руб. до 6 000 000 руб."
      - generic [ref=f127e130]: Неустойка — 20,00 % годовых с суммы просроченного платежа за каждый день просрочки в соответствии с Общими условиями кредитования. Подробнее об условиях кредитования, требованиях к страхованию, к заемщику и к документам у официальных дилеров Sollers.
      - generic [ref=f127e131]: Условия актуальны на 01.10.2025. Предложение носит информационный характер, не является публичной офертой. Банк вправе отказать в выдаче кредита.
      - generic [ref=f127e132]: Оценивайте свои финансовые возможности и риски.
      - heading "Кто может воспользоваться:" [level=3] [ref=f127e134]
      - generic [ref=f127e135]: "Программа действует в банках-партнерах для определенных кредитных продуктов:"
      - generic [ref=f127e136]: ПАО «Сбербанк» (Генеральная лицензия Банка России № 1481 от 11.08.2015), маркетинговый продукт на пикапы Sollers с субсидированной ставкой.
      - heading "Требования банка к заемщику:" [level=3] [ref=f127e138]
      - list [ref=f127e140]:
        - listitem [ref=f127e141]: Физическое лицо, индивидуальный предприниматель или самозанятый
        - listitem [ref=f127e142]: Гражданин РФ
        - listitem [ref=f127e143]: Имеет постоянную регистрацию на территории РФ
        - listitem [ref=f127e144]: Старше 21 года, но младше 75 лет — на момент окончания договора
        - listitem [ref=f127e145]: Требования к стажу работы отсутствуют
      - heading "Документы:" [level=3] [ref=f127e147]
      - list [ref=f127e149]:
        - listitem [ref=f127e150]: Паспорт гражданина РФ
        - listitem [ref=f127e151]: Водительское удостоверения (только в случае программы государственного субсидирования)
      - generic [ref=f127e152]: Максимальная сумма кредита — 6 000 000 руб.
      - heading "Что важно знать о программе:" [level=3] [ref=f127e154]
      - list [ref=f127e156]:
        - listitem [ref=f127e157]: Программа распространяется на пикапы Sollers ST6, Sollers ST8 и Sollers ST9.
        - listitem [ref=f127e158]: Программа действует до 31.07.2026г.
        - listitem [ref=f127e159]: Оформление КАСКО на приобретаемый автомобиль не обязательно.
        - listitem [ref=f127e160]: Обеспечением по кредиту является залог приобретаемого автомобиля
        - listitem [ref=f127e161]: "Необходимо предоставить полный комплект документов для оформления заявки на кредит:"
      - list [ref=f127e163]:
        - listitem [ref=f127e164]: Паспорт гражданина РФ
        - listitem [ref=f127e165]: Согласие на обработку персональных данных
        - listitem [ref=f127e166]: "Для индивидуальных предпринимателей (документы предоставляются в оригинале и должны содержать отметку о принятии налоговым органом): ф. № 3-НДФЛ; налоговая декларация по ЕНВД; налоговая декларация по УСН; налоговая декларация по ЕСХН"
      - heading "Как воспользоваться:" [level=3] [ref=f127e168]
      - list [ref=f127e170]:
        - listitem [ref=f127e171]: Вы приезжаете в автосалон, где менеджер по продажам поможет Вам в выборе автомобиля, а также определит его точную стоимость.
        - listitem [ref=f127e172]: Кредитный эксперт подскажет Вам, какие документы необходимо предоставить для получения кредита, а также произведет расчет ежемесячного платежа по кредиту.
        - listitem [ref=f127e173]: Вы готовите документы для получения кредита, предоставляете их кредитному эксперту в автосалоне и оформляете кредитную заявку. Банк рассматривает Вашу кредитную заявку и принимает решение. О решении Банка Вам сообщит кредитный эксперт.
        - listitem [ref=f127e174]: В дилерском центре Вы подписываете договор купли-продажи автомобиля, вносите сумму первоначального взноса за автомобиль, оформляете полис страхования КАСКО (если применимо) и подписываете кредитный договор.
        - listitem [ref=f127e175]: После подписания кредитного договора Вас проинформируют о времени передачи Вам автомобиля. Обычно это происходит в срок от 1 до 3 рабочих дней с момента подписания кредитного договора.
        - listitem [ref=f127e176]: Далее Вы ставите автомобиль на учет в ГИБДД
