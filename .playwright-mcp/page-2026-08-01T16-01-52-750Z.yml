      - 'heading "Программа «Бонус за трейд-ин»: выгода до 370 000 рублей*" [level=3] [ref=f127e271]'
      - heading "Преимущества программы:" [level=3] [ref=f127e273]
      - generic [ref=f127e274]: "Программа удобна для клиентов, которые хотят обменять свой старый автомобиль с пробегом на новый автомобиль Sollers: оценочная стоимость вашего старого автомобиля может стать взносом при покупке нового автомобиля и получить скидку на приобретение нового автомобиля."
      - heading "Кто может воспользоваться:" [level=3] [ref=f127e276]
      - list [ref=f127e278]:
        - listitem [ref=f127e279]: Владелец автомобиля, планирующий одновременно продать свой подержанный автомобиль и приобрести новый Sollers.
