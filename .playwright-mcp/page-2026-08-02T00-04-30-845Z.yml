      - generic [ref=f4e592]:
        - generic [ref=f4e593]:
          - paragraph [ref=f4e594]: Отличная компания. Не первый од обслуживаюсь. Настоящие профессионалы своего дела. Всегда помогут в возникших проблемах автомобиля. Отдельное спасибо мастеру Вольнову Антону!
          - paragraph [ref=f4e597]: Алексей Ар
        - generic [ref=f4e600]:
          - paragraph [ref=f4e601]: Делали сегодня ТО Zeekr, остались довольны. Отдельная благодарность Михаилу, быстро, вежливо и очень доступно все рассказал. Спасибо.
          - paragraph [ref=f4e604]: Инкогнито 8129
        - generic [ref=f4e607]:
          - paragraph [ref=f4e608]: Отличный автосалон как в части приобретения (покупала свой Zeekr), так и в части обслуживания. Прекрасный вежливый персонал, все объясняют, рассказывают и вовремя информируют. Однозначно рекомендую!
          - paragraph [ref=f4e611]: Анна Л.
        - generic [ref=f4e614]:
          - paragraph [ref=f4e615]: Была на ТО у Антона, потрясающий мастер, звонила не в один центр в Москве, это единственный человек, кто проконсультировал, предложил разные варианты по цене, и объяснил разницу! При визите все было потрясающе, угостили кофе, дали ответы на все вопросы по автомобилю, сделали ТО, напоили кофе! Вообщем все было на высоте! Теперь в другие места не ногой!)
          - paragraph [ref=f4e618]: Полина Цацуа
        - generic [ref=f4e621]:
          - paragraph [ref=f4e622]: Была на то на zeekr 001, мастер был Антон Вольнов, помог с мастер акаутом, единственный кто доступно обьяснил все функции автомобиля, показал то что даже не сказали при продаже! Отличный мастер, очень довольна, очень класная зона ожидания, Борисхоф превысил все ожидания, теперь буду обслуживаться только здесь.
          - paragraph [ref=f4e625]: Настя Можаева
        - generic [ref=f4e628]:
          - paragraph [ref=f4e629]: Все четко и быстро определили. Упала пневма на Zeekr009. Продиагностировали быстро и все устранили. Дело было в предохранителе на пневму
