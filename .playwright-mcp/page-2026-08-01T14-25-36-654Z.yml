                - paragraph [ref=f1e94]:
                  - text: Пользуюсь данным сервисом уже более 15 лет. За все время только положительные эмоции. 2 раза в год прохожу ТО только здесь. Всегда уверена в качестве выполненной работы. Очень радуют скидки на работу и запчасти. Очень внимательное отношение мастера приёмки Д. Ворожбит. Всегда объяснит, что необходимо сделать сегодня, а что может подождать до следующего ТО. И самое главное - здесь нет разводов на дополнительные и ненужные услуги. Так что свой автомобиль ( Тойота) буду и дальше обслуживать только здесь, потому что всегда уверена в качестве ремонта и запчастей. Удачи и процветания вам❤️
