                - paragraph [ref=f1e79]:
                  - text: Все очень прошло на очень хорошем уровне. В этот центр приехала в первый раз, обслуживание отличное и быстрое. Работа на качество, а не на скорость. Когда отдала машину на ремонт бампера, спустя время мне позвонили и сказали, что есть задиры и они заказали текстурированную часть заднего бампера, хотя сама я этого изначально не заметила за это отдельное спасибо. Ремонт был по КАСКО. Хоть машина не их марки, отношение было очень хорошее. Давали четкие сроки и машину отдали даже раньше. При полном осмотре машину помыли и после ремонта помыли, очень приятный бонус после ожидания моей любимой машинки☺️(не все СТО это делают, бывало такое что просили привозить в чистом виде). Очень довольна этим центром, спасибо за сервис🤩 Отдельно хочется поблагодарить мастера Максима Чернышева. За работу, внимательность и приятное общение.
