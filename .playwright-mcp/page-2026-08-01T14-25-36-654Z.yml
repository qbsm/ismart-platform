                - paragraph [ref=f1e49]:
                  - text: Отличный салон. Очень приятная атмосфера. Являюсь владельцем автомобиля фольксваген каравелла. Появилась необходимость покрасить передние крылья (появились признаки коррозии). Почитав отзывы, решил сдать автомобиль в Тойота центр Внуково, машину принимал Сергей Соловьев. Ребята - отличные специалисты, все работы были выполнены быстро и качественно. Крашенные детали не отличить от окрашенных на заводе. Сравнивать есть с чем, приходилось красить в другом месте, качество покраски было не то, чтобы прямо плохое, но очень посредственное. Всё покрасочные работы буду делать только здесь. Огромное спасибо всему коллективу.
