                - paragraph [ref=f1e34]:
                  - text: В течение трех лет обслуживаю свой автомобиль в этом центре. Все ТО прохожу здесь. Все всегда четко и понятно. Записываться нужно только заранее. Недавно пришлось побывать на кузовном ремонте - замена стекла. Познакомилась и с этой частью сервиса. Специалист Андрей Буланов сначала проконсультировал по телефону, при личной встрече обсудили все детали, нашли компромисс по цене и через два дня заказанное стекло было в центре. Оставила автомобиль и получила его готовым в обговоренный день даже с небольшими приятными "плюшками". Благодарю мастеров и Андрея Буланова за приятное сотрудничество 🤝
