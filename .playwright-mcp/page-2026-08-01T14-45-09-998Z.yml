                - paragraph [ref=f31e94]:
                  - text: "Оформляли покупку нового Ньюстара 001 в Борисхофе Джили на 2-Магистральной у Менеджера Максима Иванова. С участием кредитного специалиста. По сделке все максимально профессионально, корректно и прозрачно. Дали досконально проверить автомобиль, менеджер отзывчивый, хорошо подкован в технической части, отвечает на все вопросы, готов идти навстречу. Однозначно рекомендую как его лично, так и сам дилер. Помимо вышеуказанного: комфортная клиентская зона, администраторы тоже очень клиентоориентированные, есть все необходимое для комфортного ожидания. Спасибо за хорошую работу, было приятно иметь с вами дело."
