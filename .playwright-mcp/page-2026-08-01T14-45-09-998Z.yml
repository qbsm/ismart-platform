            - generic [ref=f31e21]:
              - generic [ref=f31e22]:
                - generic [ref=f31e24]:
                  - paragraph [ref=f31e25]: Варвара Саникович
                  - paragraph [ref=f31e26]: 28 июня
                - list [ref=f31e28]:
                  - listitem [ref=f31e29]
                  - listitem [ref=f31e30]
                  - listitem [ref=f31e31]
                  - listitem [ref=f31e32]
                  - listitem [ref=f31e33]
                - paragraph [ref=f31e34]:
                  - text: Мы приобрели свою первую семейную машину в данном салоне. Объездили 5 дилеров! Борисхов сделал лучшее предложение по всем параметрам, учли наши пожелания по допам, страхованию и хорошо оценили нашу машину в трейд-ин. Благодарим менеджера Валерия Полякова и Артема Ханяна за оперативное, комфортное общение. Отдельно хотелось бы отметить саму атмосферу салона - много пространства, прекрасная зона ожидания, кофе, чай. Кажется мелочь, но это правда важно.
                  - paragraph [ref=f31e35]:
                    - text: ...
                    - link "ещё" [ref=f31e36] [cursor=pointer]:
                      - /url: https://yandex.ru/maps/org/boriskhof_geely/89970889175/reviews?utm_source=maps-reviews-widget&utm_medium=reviews&utm_content=read-more
              - generic [ref=f31e37]:
                - generic [ref=f31e39]:
                  - paragraph [ref=f31e40]: Степан Соколов
                  - paragraph [ref=f31e41]: 18 февраля
                - list [ref=f31e43]:
                  - listitem [ref=f31e44]
                  - listitem [ref=f31e45]
                  - listitem [ref=f31e46]
                  - listitem [ref=f31e47]
                  - listitem [ref=f31e48]
                - paragraph [ref=f31e49]:
                  - text: Отличный салон, все было прозрачно, чистые условия, отличное предложение дали как по авто, которое покупали, так и по авто, которое сдавали в трейд ин. По страховкам дали также великолепное предложение, более того дали ещё и скидку на КАСКО. Отдельная благодарность менеджеру отдела продаж и просто мастеру своего дела Александру Ветчинову, благодаря его помощи было кристальное понимание процесса. На моменте задумки покупки помог с выбором нужной модели, провел шикарный тест-драйв, объяснил каждую кнопку, рычажок и тумблер в автомобиле. В общем, спасибо большое салону и Александру за предоставленный сервис и автомобиль. Категорически советую!!!
                  - paragraph [ref=f31e50]:
                    - text: ...
                    - link "ещё" [ref=f31e51] [cursor=pointer]:
                      - /url: https://yandex.ru/maps/org/boriskhof_geely/89970889175/reviews?utm_source=maps-reviews-widget&utm_medium=reviews&utm_content=read-more
              - generic [ref=f31e52]:
                - generic [ref=f31e54]:
                  - paragraph [ref=f31e55]: Сергей Харченков
                  - paragraph [ref=f31e56]: 13 мая
                - list [ref=f31e58]:
                  - listitem [ref=f31e59]
                  - listitem [ref=f31e60]
                  - listitem [ref=f31e61]
                  - listitem [ref=f31e62]
                  - listitem [ref=f31e63]
                - paragraph [ref=f31e64]:
                  - text: Отличный салон. Доступны все модели Geely к просмотру и тест-драйв. Чисто, есть где перекусить пока проводишь сделку. Покупал машину с Сергеем Краузе. Он очень помог на всех этапах, от подробного инструктажа и подбора только реально нужных допников, до непосредственно помощи с регистрацией и полного инструктажа по нюансам взаимодействия с новым авто. Богатый набор дополнительных аксессуаров был установлен оперативно. В сервисном центре (расположен под салоном) виден профессионализм сервисных инженеров. Однозначно буду тут обслуживаться!
                  - paragraph [ref=f31e65]:
                    - text: ...
                    - link "ещё" [ref=f31e66] [cursor=pointer]:
                      - /url: https://yandex.ru/maps/org/boriskhof_geely/89970889175/reviews?utm_source=maps-reviews-widget&utm_medium=reviews&utm_content=read-more
              - generic [ref=f31e67]:
                - generic [ref=f31e69]:
                  - paragraph [ref=f31e70]: Виталий А.
                  - paragraph [ref=f31e71]: 26 марта
                - list [ref=f31e73]:
                  - listitem [ref=f31e74]
                  - listitem [ref=f31e75]
                  - listitem [ref=f31e76]
                  - listitem [ref=f31e77]
                  - listitem [ref=f31e78]
                - paragraph [ref=f31e79]:
                  - text: "Хочу выразить огромную благодарность команде дилерского центра БорисХоф на Шелепихе за отличный сервис и покупку автомобиля! Отдельное спасибо говорю менеджеру Александру Пузыреву. Это тот редкий случай, когда слова «клиентоцентричность» — не просто громкий лозунг, а реальный подход к работе. Александр очень помог с продажей моего старого автомобиля по трейд-ину: все прошло максимально прозрачно, быстро и без лишних нервов. Самое главное — он всегда шел мне навстречу, подстраивался под мой график и помог решить все организационные вопросы заранее, а не в день сделки. Отдельно хочу отметить зону ожидания. Здесь есть все необходимое: свежий чай, отличный кофе. Но самое главное — вкусные печеньки, которые отдельно оценила моя жена! Это, казалось бы, мелочь, но именно из таких приятных деталей складывается общее впечатление о сервисе. В общем, если вы ищете надежного дилера, который ценит своих клиентов и не подведет при оформлении трейд-ина — смело обращайтесь к Александру Пузыреву в БорисХоф на Шелепихе. Рекомендую!"
                  - paragraph [ref=f31e80]:
                    - text: ...
                    - link "ещё" [ref=f31e81] [cursor=pointer]:
                      - /url: https://yandex.ru/maps/org/boriskhof_geely/89970889175/reviews?utm_source=maps-reviews-widget&utm_medium=reviews&utm_content=read-more
              - generic [ref=f31e82]:
