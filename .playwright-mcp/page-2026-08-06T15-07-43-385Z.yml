    - generic [ref=f10e374]:
      - generic [ref=f10e375]:
        - heading "Конфигуратор подбора шин" [level=2] [ref=f10e378]
        - generic [ref=f10e379]: Четыре вопроса — тип автомобиля, сезон, приоритет и размер — и в подборке останутся только подходящие модели Kumho из этого каталога.
      - link "Подобрать шины" [ref=f10e381] [cursor=pointer]:
        - /url: http://kumho-tires.ru.test/podbor
    - generic [ref=f10e384]:
      - generic [ref=f10e385]:
        - heading "Как выбрать шины Kumho по сезону" [level=2] [ref=f10e388]
        - generic [ref=f10e390]:
          - paragraph [ref=f10e391]:
            - text: В каталоге
            - generic [ref=f10e392]: 36 моделей и 1148 типоразмеров
            - text: с посадочным диаметром
            - generic [ref=f10e393]: от R12 до R22
            - text: . Отобрать нужные помогает фильтр по сезону, диаметру, ширине и высоте профиля.
          - paragraph [ref=f10e394]:
            - generic [ref=f10e395]: Зимние шины
            - text: —
            - generic [ref=f10e396]: 9 моделей, 432 типоразмера
            - text: "(R13–R22). Шипованные рассчитаны на лёд и укатанный снег:"
            - link "WinterCraft ice WI32" [ref=f10e397] [cursor=pointer]:
              - /url: /tires/wi32
            - text: (77 типоразмеров),
            - link "WS31" [ref=f10e398] [cursor=pointer]:
              - /url: /tires/ws31
            - text: и
            - link "WinterPorTran CW11" [ref=f10e399] [cursor=pointer]:
              - /url: /tires/cw11
            - text: "для микроавтобусов и фургонов. Нешипованные (фрикционные) — для города и трассы с частыми переходами через ноль:"
            - link "WinterCraft WP52+" [ref=f10e400] [cursor=pointer]:
              - /url: /tires/wp52-plus
            - text: (136 типоразмеров, самый широкий выбор),
            - link "WS71" [ref=f10e401] [cursor=pointer]:
              - /url: /tires/ws71
            - text: для мощных кроссоверов,
            - link "WP72" [ref=f10e402] [cursor=pointer]:
              - /url: /tires/wp72
            - text: ","
            - link "WinterCraft ice WI51" [ref=f10e403] [cursor=pointer]:
              - /url: /tires/wi51
            - text: ","
            - link "WS51" [ref=f10e404] [cursor=pointer]:
              - /url: /tires/ws51
            - text: и коммерческая
            - link "CW51" [ref=f10e405] [cursor=pointer]:
              - /url: /tires/cw51
            - text: .
          - paragraph [ref=f10e406]:
            - generic [ref=f10e407]: Всесезонные шины
            - text: —
            - generic [ref=f10e408]: 11 моделей, 253 типоразмера
            - text: "(R13–R20). Подходят там, где зима мягкая, а пробег небольшой: не нужен второй комплект и двойной шиномонтаж. Для легковых автомобилей —"
            - link "SOLUS HA32" [ref=f10e409] [cursor=pointer]:
              - /url: /tires/ha32
            - text: (97 типоразмеров),
            - link "HA32+" [ref=f10e410] [cursor=pointer]:
              - /url: /tires/ha32-plus
            - text: и
            - link "HA31" [ref=f10e411] [cursor=pointer]:
              - /url: /tires/ha31
            - text: ; для внедорожников и пикапов — линейка Road Venture (
            - link "AT52" [ref=f10e412] [cursor=pointer]:
              - /url: /tires/at52
            - text: ","
            - link "KL71" [ref=f10e413] [cursor=pointer]:
              - /url: /tires/kl71
            - text: ","
            - link "MT71" [ref=f10e414] [cursor=pointer]:
              - /url: /tires/mt71
            - text: ); для фургонов —
            - link "PorTran CX11" [ref=f10e415] [cursor=pointer]:
              - /url: /tires/cx11
            - text: .
          - paragraph [ref=f10e416]:
            - generic [ref=f10e417]: Летние шины
            - text: —
            - generic [ref=f10e418]: 16 моделей, 463 типоразмера
            - text: "(R12–R22): линейки ECSTA, Ecowing, CRUGEN и PorTran. В устойчивые морозы и на льду зимняя резина безопаснее любой всесезонной — всесезонные модели рассчитаны на мягкую зиму."
          - paragraph [ref=f10e419]:
            - generic [ref=f10e420]: Коммерческий транспорт
            - text: — семейство PorTran,
            - generic [ref=f10e421]: 107 усиленных C-типоразмеров
            - text: "(R12–R18): летняя"
            - link "PorTran KC53" [ref=f10e422] [cursor=pointer]:
              - /url: /tires/kc53
            - text: ", всесезонная"
            - link "PorTran CX11" [ref=f10e423] [cursor=pointer]:
              - /url: /tires/cx11
            - text: ", зимние"
            - link "WinterPorTran CW11" [ref=f10e424] [cursor=pointer]:
              - /url: /tires/cw11
            - text: (шипованная) и
            - link "WinterPorTran CW51" [ref=f10e425] [cursor=pointer]:
              - /url: /tires/cw51
            - text: (нешипованная) — для фургонов, микроавтобусов и лёгких грузовиков.
      - generic [ref=f10e426]:
        - heading "Оригинальная продукция и гарантия" [level=2] [ref=f10e429]
        - generic [ref=f10e431]:
          - paragraph [ref=f10e432]:
            - text: «Север Авто» —
            - generic [ref=f10e433]: официальный дистрибьютор
            - text: шин Kumho | Кумхо компании Kumho Tire в России. Шины поставляются напрямую и продаются через авторизованные шинные центры, поэтому на них действует
            - generic [ref=f10e434]: гарантия производителя
            - text: .
          - paragraph [ref=f10e435]:
            - text: Дополнительно работает программа
            - link "«Расширенная гарантия Kumho»" [ref=f10e436] [cursor=pointer]:
              - /url: /warranty
            - text: —
            - generic [ref=f10e437]: ещё один год защиты
            - text: от эксплуатационных повреждений сверх заводской гарантии. Оформить её можно
            - generic [ref=f10e438]: только на шины, купленные у авторизованных партнёров
            - text: ": их список и карта — в разделе"
            - link "«Где купить»" [ref=f10e439] [cursor=pointer]:
              - /url: /buy
            - text: ", там же отмечены центры, принимающие обращения по гарантии."
          - paragraph [ref=f10e440]:
            - text: На боковине любой шины Kumho есть
            - generic [ref=f10e441]: заводская маркировка с датой производства
            - text: — по ней видно, что шина не залежалась на складе.
