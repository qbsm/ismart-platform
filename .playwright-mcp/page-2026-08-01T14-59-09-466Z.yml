        - paragraph [ref=f97e185]: Цифровая приборная панель с диагональю 12,3 дюйма, центральный дисплей с диагональю 15,7 дюймов и разрешением 3К, встроенный в зеркало заднего вида 9-дюймовый дисплей.
      - generic [ref=f97e186] [cursor=pointer]:
        - heading "Вместительная 7-местная версия" [level=4] [ref=f97e187]
        - paragraph [ref=f97e188]: При сложенных сиденьях второго и третьего рядов в салоне помещается матрас размером 2 x 1,3 метра, при этом до потолка останется запас в 80 см. А площадь остекления в 6,54 квадратных метра является одной из максимальных в классе.
      - generic [ref=f97e189] [cursor=pointer]:
        - heading "Мощный электродвигатель" [level=4] [ref=f97e190]
        - paragraph [ref=f97e191]: Два электромотора развивают совокупную мощность 476 л.с. и крутящий момент 740 Нм. С 0 до 100 км/ч внедорожник разгоняется всего за 5,5 секунды.
      - generic [ref=f97e192] [cursor=pointer]:
