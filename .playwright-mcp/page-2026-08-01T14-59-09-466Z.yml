    - paragraph [ref=f97e22]: "ROX Motor – высокотехнологичная компания, основанная в 2021 году. Ее миссия — создание интеллектуальных автомобилей на новых источниках энергии, которые идеально подходят для любителей активного отдыха. ROX 01 — премиальный внедорожник c увеличенным запасом хода и лидер рейтинга АВТО.РУ 2025 Он сочетает комфорт электромобиля и уверенность в дальних поездках: вы получаете современную динамику, тишину в салоне и продуманную систему работы в холодном климате. ROX 01 создан для тех, кому важны надежность и стабильность на трассе, вне города и в зимние холода, когда под колесами снег и лед.Электромобиль или гибрид? Решать вам! Благодаря прогрессивной последовательной гибридной схеме, ROX 01 может использоваться как чистый электроавтомобиль, а при необходимости зарядки батареи, электроника сама подключит ДВС-генератор, который восполнит её заряд."
