                    - paragraph [ref=f92e63]:
                      - text: Приобрел в этом салоне TANK 500. Впечатления только положительные. Очень квалифицированные менеджеры, все подробно объяснили. Отдельное спасибо Дмитрию Прудникову. Приехал в первый день, обговорили условия, пообщались по поводу комплектаций на авто, а на следущий день уже приехал за своим новым автомобилем. Скорость и качество проделанной работы заслуживает наивысшей оценки!!! Был на плановом техническом обслуживании у Евгения и Сергея. Все сделано в лучшем виде. Сервис высылает видео об осмотре авто и, если требуется, дают рекомендации по обслуживанию. Работа сервиса более чем устраивает. Езжу только сюда.
