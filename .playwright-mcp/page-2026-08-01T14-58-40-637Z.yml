                    - paragraph [ref=f92e48]:
                      - text: купил тут танк 300. остался очень доволен. покупал с менеджером Дмитрием Прудниковым. на всех этапах получил полные исчерпывающие ответы. прокатился на тест драйве. сдал свой авто в трейд ин (цена с учетом скидки вышла хорошая). взял автокредит. всё успел за 2 дня (тест драйв + сомнения в 1 день, трейд ин, покупка и автокредит во второй день). никаких доп услуг не навязывали. по цене как договорились так и было, никаких уловок. плюс получил подарки, даже часть тех о которых не договаривались)). однозначно рекоменую данного дилера и особенно Дмитрия.
