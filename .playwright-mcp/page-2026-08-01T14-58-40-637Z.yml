                    - paragraph [ref=f92e33]:
                      - text: Покупал тут Танк 300. Покупка с учетом трейд-ин и доплатой. Остался очень доволен. Все прошло максимально быстро и прозрачно. Персонал отзывчивый, ненавязчивый и профессиональный. За мой автомобиль предложили устраивающую меня цену, все обещанные скидки и подарки получил, допы не навязывали (сделали только то, что сам просил). Отдельная благодарность менеджеру по продажам Амину, менеджеру по трейд-ин Вадиму и девушкам из кредитного отдела за подбор наиболее выгодного предложения по КАСКО.был на ремонте Был на ремонте колеса у Евгения. Все отлично и оперативно сделали!
