                      - listitem [ref=f92e77]
                    - paragraph [ref=f92e78]:
                      - text: "Увидел в интернете рекламу про привлекательные условия обмена автомобиля на новые машины Tank. Обратился по телефону и работал с Романом Соколовым - исключительно положительные эмоции: - показал машину и рассказал про особенности Tank 300, включая информацию о различиях между дорестайлингом и рестайлингом - оперативно организовал тест-драйв - отлично оценил текущую машину (и, что важно, машину качественно помыли - было приятно уезжать подумать о покупке) В итоге вышли на сделку и это тоже было приятно: быстро, удобно, комфортно. Все вовлеченные специалисты также были доброжелательны и нацелены на успешный результат в комфортной обстановке. К машине дали зимнюю резину, коврики, сетку в бампер, антикоррозионную обработку. Отдельно поставили еще пластиковые подкрылки. Надеюсь на долгосрочное сотрудничество (сервисный контракт же тоже оформил, чтобы закрепить стоимость ТО на ближайшие 3 года)! PS: с другими дилерами пытался побеседовать в формате «есть такое предложение - сможете предложить лучше?», но улучшить предложение БорисХоф никто не смог 😁"
                      - paragraph [ref=f92e79]:
                        - text: ...
                        - link "ещё" [ref=f92e80] [cursor=pointer]:
                          - /url: https://yandex.ru/maps/org/boriskhof_tank/191525017147/reviews?utm_source=maps-reviews-widget&utm_medium=reviews&utm_content=read-more
                  - generic [ref=f92e81]:
