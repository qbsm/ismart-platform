                      - listitem [ref=f92e92]
                    - paragraph [ref=f92e93]:
                      - text: "Хочу поделиться отличным опытом покупки автомобиля в автосалоне «БорисХоф»! Особую благодарность хочу выразить Алексею Суракову, менеджеру автосалона. Он вёл сделку с самого начала и до момента моего выезда с территории автосалона на новом Tank 300. Благодаря его профессионализму, вежливости и пониманию, я приехал в этот автосалон из соседней области и ни разу не пожалел потраченного времени. Я сдавал свою машину по программе трейд‑ин и был приятно удивлён предложенной ценой за мой автомобиль: она оказалась действительно хорошей,честной без занижений и скрытых условий, а также условиями покупки нового. Алексей проявил высокий профессионализм: подробно рассказал о модели Tank 300, ответил на все, интересуюшие меня вопросы максимально подробно и предложил оптимальный для меня вариант его приобретения, учитывая все мои пожелания. Общение было комфортным и вежливым никаких попыток навязать лишние услуги, только чёткие и понятные консультации на всех этапах. Благодаря его вовлечённости и внимательности процесс прошёл максимально гладко и прозрачно. Пакет документов был подготовлен безупречно. Также хочу отметить работу Надежды из отдела кредитования. Она не только оперативно рассчитала условия и помогла быстро оформить кредит, но и профессионально занялась страхованием: оформила полисы КАСКО и ОСАГО, предложив лучшие варианты по соотношению цены и покрытия. Все нюансы были доходчиво объяснены, документы подготовлены вовремя никаких задержек или сложностей. В итоге я стал счастливым обладателем Tank 300 — и всё благодаря слаженной работе команды «БорисХоф». Очень доволен результатом: от первой консультации до выезда на новом авто всё было чётко, профессионально и с заботой о клиенте. С радостью порекомендую этот автосалон друзьям и знакомым!"
