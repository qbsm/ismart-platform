            - generic [ref=f1e271]: Андрей
            - generic [ref=f1e272]: JAECOO J8
        - article [ref=f1e273]:
          - generic "Оценка 5 из 5" [ref=f1e274]
          - paragraph [ref=f1e285]: Брали C7 всей семьёй, сравнивали с одноклассниками. Понравилось, что дали спокойно посидеть во всех машинах и посчитали несколько вариантов кредита. Забрали автомобиль через два дня.
