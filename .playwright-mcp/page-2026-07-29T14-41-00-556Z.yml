            - generic [ref=f1e256]: JAECOO J7
        - article [ref=f1e257]:
          - generic "Оценка 5 из 5" [ref=f1e258]
          - paragraph [ref=f1e269]: Пересел на J8 с семилетнего кроссовера. Машину показали и на подъёмнике — ничего не скрывали. Комплектация топовая, 249 сил, полный привод. Доволен покупкой и отношением.
