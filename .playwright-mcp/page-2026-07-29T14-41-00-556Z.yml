            - generic [ref=f1e240]: OMODA C5
        - article [ref=f1e241]:
          - generic "Оценка 5 из 5" [ref=f1e242]
          - paragraph [ref=f1e253]: "Спасибо менеджерам за спокойный тест-драйв без навязывания. J7 понравился сразу: тихий салон, панорамная крыша. Кредит одобрили за полчаса прямо в салоне."
