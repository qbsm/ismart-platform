          - generic "Оценка 5 из 5" [ref=f1e226]
          - paragraph [ref=f1e237]: Выбирал между несколькими кроссоверами, в итоге взял C5 в кредит с трейд-ин — по деньгам вышло заметно выгоднее, чем ожидал. Оценили мою машину быстро, доплату оформили в тот же день.
