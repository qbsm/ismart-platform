          - heading "Terms and Conditions" [level=3]
          - paragraph: (OMODA & JAECOO Malaysia Professional Affiliate Programme)
        - list:
          - listitem: The list of eligible organisations, associations, institutions and/or corporation is subject to change at the sole discretion of JAECOO Auto Malaysia Sdn Bhd (“JAMSB”).
          - listitem: In the case of an eligible corporation, the vehicle purchased must be registered under the company name.
          - listitem: In the case of an eligible individual, the vehicle purchased must be registered under the individual's name or that of his immediate family member (spouse, parents or children).
          - listitem: Registration under immediate family member will require documentation proof such as marriage certificate or birth certificate, whichever applicable.
          - listitem: Customer shall submit all required documentations to JAMSB's authorised dealers, failing which the application will not be processed by JAMSB.
          - listitem: Eligible customer shall only be entitled to all the benefits or the purchase of brand-new OMODA & JAECOO vehicle from JAMSB's authorised dealers.
          - listitem: The applicability, computation and allowances of the benefits in each purchase shall be subject to approval by JAMSB at its absolute discretion.
          - listitem: All decisions made by JAMSB are final and no appeals or discussions will be entertained.
          - listitem: JAMSB reserves the right to terminate the Professional Affiliate Programme at any time without prior notice.
          - listitem: By submitting the application to JAMSB's authorised dealers, the customer affirms that he has read, understood, and agreed to the policies in JAMSB's Privacy Policy and consent to his personal data being processed and used by JAMSB as stipulated in the said Privacy Policy in OMODA & JAECOO official website.
          - listitem: Only cars manufactured in 2026 are eligible for PAP.
          - listitem: These Terms and Conditions may be amended, replaced and/or deleted at any time in JAMSB's sole discretion.
