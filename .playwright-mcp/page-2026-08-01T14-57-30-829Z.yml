                  - listitem [ref=f82e92]
                - paragraph [ref=f82e93]:
                  - text: "Недавно приобрели автомобиль Haval F7 в вашем автосалоне и остались очень довольны как самим автомобилем, так и уровнем обслуживания. Особенно хотим отметить работу менеджера Альберта. С самого начала Альберт проявил себя как настоящий профессионал: ответил на все вопросы и не навязывал дополнительных услуг. Вся сделка прошла быстро и прозрачно, оформление документов заняло минимум времени. Haval F7 превзошёл мои ожидания: современный дизайн, богатое оснащение, комфортный салон и отличная динамика. Уже успел оценить автомобиль в разных условиях — он действительно радует! Большое спасибо Альберту и всей команде за внимательное отношение и высокий уровень сервиса! Обязательно буду рекомендовать ваш автосалон друзьям и знакомым."
