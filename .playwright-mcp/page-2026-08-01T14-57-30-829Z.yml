                  - listitem [ref=f82e47]
                - paragraph [ref=f82e48]:
                  - text: "12 апреля 2026 года заехали в салон, посмотреть haval jolion. В выборе помог Дмитрий Берлин. Чётко и по делу всё рассказал и показал, даже спустились на выдачу, посмотрели авто в другом цвете. Дмитрий грамотно помог сориентироваться среди вариантов, полностью рассказал обо всех ценах. Днём мы договорились, что берём, на пару часов отъехали, вечером забрали машину. Добавили подарки: коврики, брызговики, зимнюю резину, защитную сетку. Процесс оформления не быстрый, конечно, но и мы не корову покупали) Внесли сразу 75% стоимости автомобиля, остальное в рассрочку получилось под 0,01%. В салоне приятно находиться, чисто и уютно. Спасибо Дмитрию за профессиональный и деликатный подход"
                  - paragraph [ref=f82e49]:
                    - text: ...
                    - link "ещё" [ref=f82e50] [cursor=pointer]:
                      - /url: https://yandex.ru/maps/org/boriskhof_haval_city/180445374933/reviews?utm_source=maps-reviews-widget&utm_medium=reviews&utm_content=read-more
              - generic [ref=f82e51]:
                - generic [ref=f82e53]:
                  - paragraph [ref=f82e54]: Елена Ольшанникова
                  - paragraph [ref=f82e55]: 21 апреля
