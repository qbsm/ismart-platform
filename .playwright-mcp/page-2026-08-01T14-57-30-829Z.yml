                  - listitem [ref=f82e75]
                  - listitem [ref=f82e76]
                  - listitem [ref=f82e77]
                - paragraph [ref=f82e78]:
                  - text: От покупки автомобиля остались только положительные эмоции. Выбирал Хавал Дарго, черный цвет, максималка, машина нужна была из наличия. Обзвонил много салонов, везде были только обещания и пустые слова. Позвонил в БорисХоф, пообщавшись с продавцом -консультантом Степаном Калининым получил всю нужную мне информацию и фото автомобиля, что он есть в наличии в салоне. При этом получил хорошую скидку и допоы в подарок. Степан все детально объяснил, так как я проживаю в другом регионе все этапы подготовки документов проходили по телефону. По прибытию в автосалон, всё , что обсуждалось ранее было предоставлено, плюсом ещё в подарок установили допы, помимо оговоренных ранее. Сама процедура оформления заняла чуть более часа, что очень приятно. Хотелось бы выразить слова благодарности Степану за оказанные услуги, человек слова, так держать.
                  - paragraph [ref=f82e79]:
                    - text: ...
                    - link "ещё" [ref=f82e80] [cursor=pointer]:
                      - /url: https://yandex.ru/maps/org/boriskhof_haval_city/180445374933/reviews?utm_source=maps-reviews-widget&utm_medium=reviews&utm_content=read-more
