                  - listitem [ref=f82e60]
                  - listitem [ref=f82e61]
                  - listitem [ref=f82e62]
                - paragraph [ref=f82e63]:
                  - text: Покупали в апреле автомобиль Haval f7. До Борис Хоф ездили по салонам, но выбор пал именно на них. Понравилось , что сразу идёт разговор по делу, окончательная цена, возможность подарков (куда же без них), условия трейд ин (оценили лучше, чем в других автосалонах). Менеджер Юлия Андрюкова предельно понятно и ненавязчиво все изложила. Предложила тест драйв, сходили на крышу и посмотрели наш будущий автомобиль. Конечно хочется отметить сам салон. Чистота, порядок, приятные запахи. Кофе, печенья, конфетки в неограниченном количестве. Всё сотрудники очень вежливы и приветливы. Мы довольны, спасибо Юлии и Борис Хоф!
                  - paragraph [ref=f82e64]:
                    - text: ...
                    - link "ещё" [ref=f82e65] [cursor=pointer]:
                      - /url: https://yandex.ru/maps/org/boriskhof_haval_city/180445374933/reviews?utm_source=maps-reviews-widget&utm_medium=reviews&utm_content=read-more
              - generic [ref=f82e66]:
                - generic [ref=f82e68]:
                  - paragraph [ref=f82e69]: Василий К.
                  - paragraph [ref=f82e70]: 2 апреля
