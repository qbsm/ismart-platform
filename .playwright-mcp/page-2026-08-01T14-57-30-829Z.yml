                - paragraph [ref=f82e33]:
                  - text: "Хотели покупать автомобиль в Белгороде у единственного дилера на весь город, но диллер, пользуясь своей монополией в гороле отдавал автомобиль только с ненужным доп.оборудовпнием, за которое хотел 120 тысяч и ещё допом просил 40 тысяч за доп. гарантию, а также авто был только в чёрном цвете, в итоге рассматривали Воронеж, но через Сервис Сберавто нам нашли нужный авто в салоне БорисХоф. С нами связался менеджер Альберт Дзбоев, работой которого мы остались полностью удовлетворены. Альберт рассказал нам о всех плюсах покупки авто у него, сделал полный расклад по стоимости авто. Предложил только нужные допы: зимнюю резину и коврики салона и в багажник, которые отдал в подарок, сделав дополнительную скидку от рекомендовано розничной цены производителя. Мы были приятно удивлены оперативности в работе Альберта, с которым все условия покупки были предварительно оперативно и дистанционно согласованы, в том числе поданы документы и согласована банком рассрочка 0.01% на 3 года. У нас были сомнения, стоит ли ехать в Москву и мы склонялись взять автомобиль ближе, но в последний момент взвесив все плюсы и минусы решили ехать в Москву и не пожалели. Альберт был постоянно на связи на все вопросы отвечал быстро и по существу. В Москве встретил нас у станции метро и довёз до салона на тестовом автомобиле. В салоне пришлось провести большую половину дня т.к. автомобиль только приехал на автовозе, но все необходимые мероприятия по предпрожажной подготовке были выполнены и мы уехали из салона на новом авто. В салоне есть всё необходимое для комфортного ожидания: места для зарядки гаджетов, чай, кофе, печенье, также есть столовая, есть банкомат Альфабанка. Альберту желаем побольше клиентов и благодарим за оперативное обслуживание и гостеприимство."
