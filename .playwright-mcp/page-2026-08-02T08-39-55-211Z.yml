    - paragraph [ref=f9e922]: Вся представленная на данном сайте информация, касающаяся автомобилей, цены автомобилей, носит информационный характер и не является публичной офертой.Подробности можно уточнить у консультантов отдела продаж. Вся представленная на сайте информация, касающаяся стоимости работ, сервисного обслуживания и аксессуаров, носит информационный характер и не является публичной офертой, определяемой положениями ст. 437 (2) ГК РФ. Для получения подробной информации обращайтесь в наши сервисные центры. Опубликованная на данном сайте информация может быть изменена в любое время без предварительного уведомления.*Программа «3 × ТО в подарок» реализуется ООО «СОЛЛЕРС Карго» совместно с официальными дилерами SOLLERS. Программа действует для покупателей автомобилей Sollers SF4 (СФ4), Sollers SF5 (СФ5), Sollers SF7 (СФ7) и Sollers Argo (Арго) и позволяет в течение трёх лет или до наступления даты четвёртого ТО в соответствии с графиком и регламентом сервисного обслуживания автомобилей Sollers (в зависимости от того, какое из условий наступит ранее) произвести техническое обслуживание у официального дилера SOLLERS без оплаты работ и замены деталей, предусмотренных регламентом проведения работ ООО «СОЛЛЕРС Карго» в рамках технического обслуживания, при условии соблюдения всех условий программы, в том числе прохождения ТО-2 в соответствии с регламентом по коммерческой стоимости у любого официального дилера Sollers. Несовместима с другими маркетинговыми программами, кроме «Бонус за лизинг», «Бонус за трейд-ин». Предложение ограничено, действует по 31.07.2026, не является публичной офертой и может быть изменено в любое время. Подробности программы и наличие а/м — у вашего дилера и на www.sollers-cargo.ru.**Выгода при покупке автомобилей Sollers SF5 (СФ5) Автобусы и модификаций на его основе по программе «Бонус за трейд-ин», реализуемой дистрибьютором совместно с официальными дилерами. Указанная программа позволяет получить выгоду при покупке автомобиля у официального дилера Sollers в размере до 500 000 рублей с НДС при сдаче дилеру по системе трейд-ин другого подержанного автомобиля. Совместима только с программой «3×ТО в подарок». Предложение ограничено, не является офертой и действует по 31.07.2026 г. Подробности и актуальную информацию об условиях приобретения автомобиля уточняйте у официальных дилеров Sollers.***Выгода при покупке автомобилей под маркой Sollers TR (ТР) и Sollers SF5 (СФ5) в модификации автобус по программе «Бонус за лизинг», реализуемой дистрибьютором совместно с официальными дилерами. Указанная программа позволяет получить выгоду до 500 000 ₽ при приобретении автомобилей в лизинг через лизинговые компании-партнёры. Список лизинговых компаний-партнёров может различаться в зависимости от региона дилера — уточняйте у вашего дилера. Предложение ограничено, не является офертой и действует по 31.07.2026 на автомобили Sollers SF4 (СФ4), Sollers SF5 (СФ5), Sollers Argo (Арго), Sollers SP7 (СП7), Sollers ST6 (СТ6), Sollers ST8 (СТ8), Sollers ST9 (СТ9) и Sollers TR50 (ТР50), Sollers TR80 (ТР80), Sollers TR120 (ТР120), Sollers TR180 (ТР180). ООО «СОЛЛЕРС Карго» сохраняет за собой право вносить изменения в указанные предложения в любое время. Подробности, актуальные условия и наличие а/м — у дилера и на www.sollers-cargo.ru.
