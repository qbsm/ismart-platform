      - generic [ref=f6e71]:
        - heading "Где посмотреть размер шины" [level=2] [ref=f6e74]
        - paragraph [ref=f6e77]:
          - text: "Размер написан на боковине и выглядит так:"
          - generic [ref=f6e78]: 205/55 R16 91V
          - text: . Первое число —
          - generic [ref=f6e79]: ширина протектора
          - text: в миллиметрах, второе —
          - generic [ref=f6e80]: высота профиля
          - text: в процентах от ширины, число после R —
          - generic [ref=f6e81]: посадочный диаметр
          - text: в дюймах, он должен совпадать с диаметром диска. Дальше идут
          - generic [ref=f6e82]: индекс нагрузки
          - text: (91 — 615 кг на колесо) и
          - generic [ref=f6e83]: индекс скорости
          - text: "(V — до 240 км/ч): брать ниже заводских значений нельзя. Заводские размеры для вашей машины указаны в руководстве по эксплуатации и на табличке в проёме водительской двери или на лючке бензобака."
