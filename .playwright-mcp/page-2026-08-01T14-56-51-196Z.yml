                - paragraph [ref=f77e79]:
                  - text: "Хочу выразить огромную благодарность команде дилерского центра БорисХоф на Шелепихе за отличный сервис и покупку автомобиля! Отдельное спасибо говорю менеджеру Александру Пузыреву. Это тот редкий случай, когда слова «клиентоцентричность» — не просто громкий лозунг, а реальный подход к работе. Александр очень помог с продажей моего старого автомобиля по трейд-ину: все прошло максимально прозрачно, быстро и без лишних нервов. Самое главное — он всегда шел мне навстречу, подстраивался под мой график и помог решить все организационные вопросы заранее, а не в день сделки. Отдельно хочу отметить зону ожидания. Здесь есть все необходимое: свежий чай, отличный кофе. Но самое главное — вкусные печеньки, которые отдельно оценила моя жена! Это, казалось бы, мелочь, но именно из таких приятных деталей складывается общее впечатление о сервисе. В общем, если вы ищете надежного дилера, который ценит своих клиентов и не подведет при оформлении трейд-ина — смело обращайтесь к Александру Пузыреву в БорисХоф на Шелепихе. Рекомендую!"
